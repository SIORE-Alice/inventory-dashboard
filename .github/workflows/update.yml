name: Update inventory dashboard

on:
  schedule:
    # 01:00 UTC = 10:00 KST daily
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: '1Tm-hxHQ_Uzw_Hn7wl5Yr0iyh5W80VuwKTISHryTveYU'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Build index.html from Google Sheet
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to index.html, skipping commit."
          else
            git add index.html
            git commit -m "Auto-update inventory dashboard from Google Sheet"
            git push
          fi
