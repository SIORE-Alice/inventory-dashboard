name: Update inventory dashboard

on:
  schedule:
    # 01:15 UTC = 10:15 KST daily (fallback safety net in case the webhook misses an edit)
    - cron: '15 1 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [sheet-updated]

concurrency:
  group: inventory-dashboard-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: '1Tm-hxHQ_Uzw_Hn7wl5Yr0iyh5W80VuwKTISHryTveYU'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Build index.html from Google Sheet
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          if git diff --quiet -- index.html; then
            echo "No changes to index.html, skipping commit."
          else
            git add index.html
            git commit -m "Auto-update inventory dashboard (event: ${{ github.event_name }})"
            git push
          fi
